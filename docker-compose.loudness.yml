# 响度增强覆盖：与 docker-compose.full.yml 一起使用

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  loudness:
    image: "${LOUDNESS_IMAGE:-ghcr.io/qq01-hub/openmusic-meting-api-audio-loudness:latest}"
    restart: unless-stopped
    networks:
      openmusic:
        aliases:
          - meting-api-audio-loudness
    init: true
    stop_grace_period: 10s
    environment:
      PORT: "3100"
      # Redis 设了密码时，把 LOUDNESS_REDIS_URL 设为 redis://:<REDIS_PASSWORD>@redis:6379
      # （install.sh 生成 .env 时会自动写入与 REDIS_PASSWORD 一致的该变量）
      REDIS_URL: "${LOUDNESS_REDIS_URL:-redis://redis:6379}"
      MAX_DOWNLOAD_BYTES: "67108864"
      REQUEST_TIMEOUT_MS: "30000"
      ANALYSIS_CONCURRENCY: "2"
      ANALYSIS_QUEUE_LIMIT: "16"
      ANALYSIS_QUEUE_TIMEOUT_MS: "2000"
      CACHE_OPERATION_TIMEOUT_MS: "500"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/healthz').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    mem_limit: 1g
    cpus: 1.0
    logging: *default-logging

  meting:
    environment:
      LOUDNESS_SERVICE_URL: http://meting-api-audio-loudness:3100/analyze
    depends_on:
      loudness:
        condition: service_healthy

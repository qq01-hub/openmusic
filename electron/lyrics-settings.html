<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>歌词样式</title><link rel="stylesheet" href="./lyrics-settings.css"></head><body>
<main class="settings"><header><h1>歌词样式</h1><button id="settings-close" type="button" aria-label="关闭歌词样式">×</button></header>
<label>主歌词颜色 <input id="active-color" type="color"></label><label>主歌词大小 <input id="active-size" type="range" min="12" max="32"><output id="active-size-value"></output></label>
<label>翻译歌词颜色 <input id="translation-color" type="color"></label><label>翻译歌词大小 <input id="translation-size" type="range" min="12" max="32"><output id="translation-size-value"></output></label>
<p>锁定按钮可防止误拖动歌词条。</p></main><script src="./lyrics-settings-renderer.js"></script></body></html>

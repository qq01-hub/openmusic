# 全量版：OpenMusic + Redis + Meting-API。
# 用法：复制 .env.full.example 为 .env，填入随机凭据后再启动。
#       docker compose --env-file .env -f docker-compose.full.yml up -d
#
# Meting 管理后台仅监听宿主机回环地址；远程管理请使用 SSH 隧道。

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  meting:
    image: w3126197382/meting-api:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${METING_PORT:-3000}:3000"
    environment:
      ADMIN_PATH: ${METING_ADMIN_PATH:?请在 .env 中设置随机 METING_ADMIN_PATH}
      ADMIN_USERNAME: ${METING_ADMIN_USERNAME:?请在 .env 中设置 METING_ADMIN_USERNAME}
      ADMIN_PASSWORD: ${METING_ADMIN_PASSWORD:?请在 .env 中设置强 METING_ADMIN_PASSWORD}
    volumes:
      - ./data/meting:/app/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000"]
      interval: 15s
      timeout: 5s
      retries: 3

  openmusic:
    image: w3126197382/openmusic:latest
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "${OPENMUSIC_PORT:-4000}:4000"
    environment:
      PORT: 4000
      NODE_ENV: production
      DOCKER_REDIS_URL: redis://redis:6379/0
      DOCKER_METING_URL: http://meting:3000
      ROOM_CREDENTIAL_ENCRYPTION_KEY: ${ROOM_CREDENTIAL_ENCRYPTION_KEY:?请在 .env 中设置 ROOM_CREDENTIAL_ENCRYPTION_KEY}
    volumes:
      - ./data/.env:/app/server/.env
      - ./data/runtimeConfig.json:/app/server/runtimeConfig.json
      - ./data/adminConfig.json:/app/server/adminConfig.json
      - ./data/setup.lock:/app/server/setup.lock
      - ./data/downloads:/app/server/downloads
    depends_on:
      redis:
        condition: service_healthy
      meting:
        condition: service_healthy

volumes:
  redis-data:

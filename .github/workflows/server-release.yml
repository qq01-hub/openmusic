name: Server Release ZIP

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '正式发布标签，例如 v3.6.6'
        required: true

# GH_TOKEN 为当前仓库的内置 token：Release 只发到运行本 workflow 的仓库自身，
# fork 上触发也只会发到 fork，不会写到上游仓库，无需额外防误推处理
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --prefix client
      - run: npm run build:check
      - name: Create deployment archive
        run: node scripts/build-server-release.mjs
        env:
          RELEASE_VERSION: ${{ inputs.tag || github.ref_name }}
      - name: Publish ZIP
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --generate-notes
          fi
          gh release upload "$RELEASE_TAG" release/openmusic-build.zip --clobber

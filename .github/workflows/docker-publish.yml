name: Docker Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # 推送目标一律由仓库所有者拼接：上游仓库（qq01-hub）的 DOCKERHUB_USERNAME 恰为
      # w3126197382，行为与旧版一致；fork 只能推自己账号下的同名仓库，不会误推上游。
      # 未配置 DOCKERHUB_USERNAME secret 的 fork 跳过登录与推送、只做构建验证。
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: env.DOCKERHUB_USERNAME != ''
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: ${{ env.DOCKERHUB_USERNAME != '' }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            OPENMUSIC_RELEASE_VERSION=${{ github.ref_name }}
          tags: |
            ${{ env.DOCKERHUB_USERNAME != '' && format('{0}/openmusic:latest', env.DOCKERHUB_USERNAME) || 'openmusic:latest' }}
            ${{ env.DOCKERHUB_USERNAME != '' && format('{0}/openmusic:{1}', env.DOCKERHUB_USERNAME, github.ref_name) || format('openmusic:{0}', github.ref_name) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

name: Docker Publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      # 推送目标一律由仓库所有者拼接：上游仓库（qq01-hub）的 DOCKERHUB_USERNAME 恰为
      # w3126197382，行为与旧版一致；fork 只能推自己账号下的同名仓库，不会误推上游。
      # 未配置 DOCKERHUB_USERNAME secret 的 fork 跳过登录与推送、只做构建验证。
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: env.DOCKERHUB_USERNAME != ''
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: ${{ env.DOCKERHUB_USERNAME != '' }}
          platforms: linux/amd64,linux/arm64
          build-args: |
            OPENMUSIC_RELEASE_VERSION=${{ github.ref_name }}
          tags: |
            ${{ env.DOCKERHUB_USERNAME != '' && format('{0}/openmusic:latest', env.DOCKERHUB_USERNAME) || 'openmusic:latest' }}
            ${{ env.DOCKERHUB_USERNAME != '' && format('{0}/openmusic:{1}', env.DOCKERHUB_USERNAME, github.ref_name) || format('openmusic:{0}', github.ref_name) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
